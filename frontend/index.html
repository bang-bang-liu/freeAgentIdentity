<!doctype html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload" href="/assets/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      try {
        const theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.classList.toggle('light', theme === 'light' || (theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches));
      } catch { document.documentElement.classList.remove('light'); }
    </script>
    <link rel="icon" type="image/svg+xml" href="/assets/brand-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BangBang 账号管理工作台" />
    <title>BangBang | 账号管理</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
